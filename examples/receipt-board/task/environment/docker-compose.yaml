# Topology adapted from Olam Harbor's examples/tasks/hello-seats Compose layout.
x-seat: &seat
  build: ./player
  user: player
  working_dir: /home/player
  command: ["sleep", "infinity"]
  init: true
  networks: [play]
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    init: true
    networks:
      play:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).close()"]
      interval: 1s
      timeout: 2s
      retries: 30
  p1:
    <<: *seat
    environment:
      SEAT: p1
  p2:
    <<: *seat
    environment:
      SEAT: p2

networks:
  play: {}
