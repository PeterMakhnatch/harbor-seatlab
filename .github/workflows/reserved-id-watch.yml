name: Watch the first Olam contribution without writing upstream
on:
  workflow_dispatch:
  schedule:
    # Only seven planned dates in November. The planner also checks the year.
    - cron: '37 15 20-26 11 *'
  pull_request:
    types: [opened]
    paths: ['.github/workflows/reserved-id-watch.yml', 'examples/identity-watch/**']
permissions:
  contents: read
concurrency:
  group: reserved-id-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'PeterMakhnatch/harbor-seatlab' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$EVENT" != schedule ]]; then options+=(--manual); fi
          cases=$(python3 -I -S examples/identity-watch/plan.py "${options[@]}")
          count=$(jq -er '.include | length' <<< "$cases")
          printf 'cases=%s\ncount=%s\n' "$cases" "$count" >> "$GITHUB_OUTPUT"
          printf 'Resolved %s official revision(s). An empty plan runs no compatibility tests.\n' "$count" >> "$GITHUB_STEP_SUMMARY"
  contract:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cases) }}
    name: Check identity / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: olamlabs/harbor-multiagent
          ref: ${{ matrix.revision }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: PeterMakhnatch/harbor-multiagent
          ref: 0e2b6a1289681996a691bbecec4448eaada083e8
          path: proposal
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install this upstream revision’s locked runtime and the fixed test tools
        run: |
          uv sync --project upstream --locked --no-dev --python 3.13
          uv pip install --python upstream/.venv/bin/python pytest==9.0.2 pytest-asyncio==1.3.0
      - name: Exercise the reserved UUID on stock, then the prospective merge if needed
        run: |
          python3 -I -S examples/identity-watch/check.py upstream proposal upstream/.venv/bin/python --out "$RUNNER_TEMP/identity.json"
      - name: Summarize the observation, including non-passing results
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/identity.json"; then
            jq -r '"Upstream `\(.upstream_sha)`: **\(.status)**."' "$RUNNER_TEMP/identity.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No compatibility receipt. Setup or execution did not finish.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: identity-${{ matrix.name }}
          path: ${{ runner.temp }}/identity.json
          if-no-files-found: warn
          retention-days: 14
