name: Verify SeatLab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - name: Compare two policies on real public observations
        run: |
          out=$(mktemp -d)
          seatlab replay examples/dispatch.jsonl --out "$out/arrival.jsonl" --policy arrival
          seatlab replay examples/dispatch.jsonl --out "$out/latest.jsonl" --policy arrival --transform latest
          seatlab compare "$out/arrival.jsonl" "$out/latest.jsonl"
          seatlab replay examples/meeting.jsonl --out "$out/observed.jsonl" --policy observed
          seatlab replay examples/meeting.jsonl --out "$out/solver.jsonl" --policy intersection
          seatlab compare "$out/observed.jsonl" "$out/solver.jsonl"
      - name: Stop at the first changed decision on real interactive histories
        run: |
          out=$(mktemp -d)
          seatlab prefix examples/cursor-source.jsonl \
            --exec "$(command -v python)" "$PWD/examples/cursor_policy.py" \
            --budget-rounds 8 > "$out/forecast.json"
          jq -e '
            .counts.diverged == 1 and .counts.matched_closed == 1 and
            .counts.withheld_suffix == 15 and
            any(.episodes[]; .id == "calendar:2-1:cursor:m1" and .boundary_turn == 9)
          ' "$out/forecast.json"
          seatlab align examples/cursor-source.jsonl examples/cursor-target.jsonl \
            --pairs examples/cursor-pairs.json > "$out/native.json"
          jq -e '
            .counts.pairs == 2 and .counts.matched == 1 and
            any(.pairs[]; .id == "2-1" and .status == "action_changed" and
                .boundary_turn == 9 and .target_action == {"action":null})
          ' "$out/native.json"
      - name: Reconcile independent worker ledgers in reverse delivery order
        run: |
          out=$(mktemp -d)
          tape=examples/meeting-sources.jsonl
          seatlab partition "$tape" --shards 2 --policy intersection \
            --transform-file examples/meeting-first8.json --out "$out/plan"
          for i in 1 2; do
            seatlab replay "$out/plan/part-000$i.jsonl" --policy intersection \
              --transform-file "$out/plan/context.json" --out "$out/result-$i.jsonl" &
            pids[$i]=$!
          done
          wait "${pids[1]}" && wait "${pids[2]}"
          seatlab merge --plan "$out/plan/plan.json" --tape "$tape" \
            --out "$out/merged.jsonl" "$out/result-2.jsonl" "$out/result-1.jsonl"
          seatlab replay "$tape" --policy intersection --transform-file examples/meeting-first8.json \
            --out "$out/serial.jsonl"
          cmp "$out/merged.jsonl" "$out/serial.jsonl"
      - name: Measure lost context on acknowledged coordinator inputs
        run: |
          seatlab context-audit examples/cursor-source.jsonl --field /round |
            jq -e '.fit.counts.eligible == 29 and .fit.additional_minimum_errors == 4 and .fit.full.minimum_errors == 0'
