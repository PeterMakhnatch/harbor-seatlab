name: Replicate a frozen Hanabi deck on stock Harbor
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-hanabi.yml'
      - 'examples/hanabi-panel/prepare.py'
      - 'examples/hanabi-panel/export_native.py'
      - 'examples/world-order/from-hanabi.py'
      - 'src/seatlab/matrix*.py'
      - 'src/seatlab/worker_*.py'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.13.9'
      - name: Install SeatLab
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/analyst"
          uv pip install --python "$RUNNER_TEMP/analyst/bin/python" .
      - name: Rebuild the original v0.9.0 source and compare its pins
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/analyst/bin/python"
          cli="$RUNNER_TEMP/analyst/bin/seatlab"
          ex=examples/hanabi-panel
          bundle="$RUNNER_TEMP/source-bundle"
          mkdir "$bundle"
          curl --fail --silent --show-error --location \
            https://github.com/PeterMakhnatch/harbor-seatlab/releases/download/v0.9.0/native-world-order.tar.gz \
            --output "$RUNNER_TEMP/source.tar.gz"
          "$py" "$ex/prepare.py" source "$RUNNER_TEMP/source.tar.gz" --out "$RUNNER_TEMP/inputs"
          "$cli" study build-matrix "$RUNNER_TEMP/inputs/matrix.json" --out "$bundle/source" > "$bundle/source-receipt.json"
          jq -e --slurpfile selection "$ex/source-selection.json" --slurpfile handoff "$ex/handoff-pins.json" '
            .study_sha256 == $selection[0].study_sha256 and .design_sha256 == $selection[0].design_sha256 and
            .worklist_sha256 == $handoff[0].worklist_sha256 and .candidate_matrix_sha256 == $handoff[0].candidate_matrix_sha256' "$bundle/source-receipt.json"
      - id: matrix
        name: Dispatch only the four worlds in the pinned worklist
        run: |
          wl="$RUNNER_TEMP/source-bundle/source/worklist.json"
          jq -e '.selected_cases == ["d00"] and .unmeasured == [] and
            [.jobs[].id] == ["d00.ll","d00.lr","d00.rl","d00.rr"]' "$wl"
          printf 'matrix=%s\n' "$(jq -c '{include:[.jobs[]|{job:.id,case:.case,arm:.arm}]}' "$wl")" >> "$GITHUB_OUTPUT"
      - name: Publish the source bundle and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-hanabi-source
          path: ${{ runner.temp }}/source-bundle/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: olamlabs/harbor-multiagent
          ref: 6aeb609e31fd77e5f89ce3bcb018db8045520fb7
          path: stock-olam
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: PeterMakhnatch/harbor-multiagent
          ref: 48cbcf76e3a49b3bcb1a6b9b6e2b71762a038cec
          path: game-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.13.9'
      - name: Install stock Harbor and separate analysis tools
        run: |
          set -euo pipefail
          uv sync --project stock-olam --locked --no-dev --python 3.12
          uv venv --python 3.12 "$RUNNER_TEMP/analyst"
          uv pip install --python "$RUNNER_TEMP/analyst/bin/python" . 'PyYAML==6.0.3'
      - name: Run this one team in its own native world
        env:
          JOB: ${{ matrix.job }}
          CASE: ${{ matrix.case }}
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          # Only the fixed Hanabi case and arms are accepted; nothing from the matrix is evaluated.
          test "$CASE" = d00
          case "$ARM" in ll | lr | rl | rr) ;; *) echo "unexpected arm" >&2; exit 2 ;; esac
          test "$JOB" = "$CASE.$ARM"
          team="${ARM^^}"
          d="$PWD/game-source/adapters/hanabi-crossplay"
          root="$RUNNER_TEMP/deck-zero"
          py="$RUNNER_TEMP/analyst/bin/python"
          curl -fsSL https://github.com/PeterMakhnatch/harbor-seatlab/releases/download/v0.8.0/hanabi-predictions-64.json -o "$RUNNER_TEMP/forecasts.json"
          echo '9302b9818793a5dbd8efaf5e300684395ec13d7495d84ab4e33c93f8432f91f9  forecasts.json' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          "$py" "$d/study.py" prepare "$root" --decks 1
          config="$root/configs/$CASE-$team.json"
          test -f "$config"
          # One world, no retry. The other three registered teams stay unattempted here.
          "$PWD/stock-olam/.venv/bin/harbor" trial start -c "$config"
          # Launch receipt: the stock trial id, read before any public export. It comes from
          # the stock config's trial_name and the stock result.json, never from world-order,
          # role files, or a label derived from them. It vouches for launch identity only.
          name="$(jq -er '.trial_name | select(type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))' "$config")"
          res="$root/trials/$name/result.json"
          test -f "$res"
          test ! -L "$res"
          jq -e --arg job "$JOB" --arg name "$name" '
            select(.trial_name == $name and (.id | type == "string") and
              (.id | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))) |
            {schema: "seatlab.launch-receipt/v1", job: $job, trial_name: $name, id: .id}' \
            "$res" > "$RUNNER_TEMP/launch.json.tmp"
          mkdir "$RUNNER_TEMP/launch-receipt"
          mv "$RUNNER_TEMP/launch.json.tmp" "$RUNNER_TEMP/launch-receipt/launch.json"
          mkdir "$RUNNER_TEMP/public-result"
          "$py" "$d/collect.py" "$root" "$RUNNER_TEMP/forecasts.json" \
            --episodes "$RUNNER_TEMP/public-result/episodes" > "$RUNNER_TEMP/public-result/report.json"
          jq -e --arg team "$team" '
            .counts.registered == 4 and .counts.valid == 1 and .counts.unattempted == 3 and
            .counts.matched == 1 and .counts.duplicate_uuids == 0 and
            .episodes.episode_count == 2 and
            ([.cells[] | select(.status == "matched")] | length) == 1 and
            any(.cells[]; .deck_id == 0 and .pairing == $team and .status == "matched")' \
            "$RUNNER_TEMP/public-result/report.json"
          # Reconcile each world event with the exported role receipt before upload.
          pub="$RUNNER_TEMP/public-result"
          "$py" examples/hanabi-panel/export_native.py "$RUNNER_TEMP/deck-zero" "$pub/report.json" \
            "$pub/episodes/episodes.jsonl" --out "$RUNNER_TEMP/world-order"
          mkdir "$RUNNER_TEMP/job-evidence"
          cp "$RUNNER_TEMP/world-order/$CASE-$team.jsonl" "$RUNNER_TEMP/job-evidence/episodes.jsonl"
          cp "$RUNNER_TEMP/world-order/$CASE-$team.order.json" "$RUNNER_TEMP/job-evidence/order.json"
      - name: Upload only the flat evidence for this one job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.job }}
          path: |
            ${{ runner.temp }}/job-evidence/episodes.jsonl
            ${{ runner.temp }}/job-evidence/order.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload the separate launch receipt for this one job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-${{ matrix.job }}
          path: ${{ runner.temp }}/launch-receipt/launch.json
          if-no-files-found: ignore
          retention-days: 7

  compare:
    needs: [source, native]
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.13.9'
      - name: Install SeatLab
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/analyst"
          uv pip install --python "$RUNNER_TEMP/analyst/bin/python" .
      - name: Download the source bundle into its own folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-hanabi-source
          path: ${{ runner.temp }}/source-download
      - name: Create empty return roots for interrupted workers
        run: mkdir "$RUNNER_TEMP/worker-returns" "$RUNNER_TEMP/launch-receipts"
      - name: Download native returns without merging worker directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: d*.*
          merge-multiple: false
          path: ${{ runner.temp }}/worker-returns
      - name: Download the separate launch receipts without merging them
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: launch-d*.*
          merge-multiple: false
          path: ${{ runner.temp }}/launch-receipts
      - name: Assemble the launch registry from the receipts and pin its digest
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/launch"
          "$RUNNER_TEMP/analyst/bin/python" -I examples/hanabi-panel/native_registry.py receipts \
            "$RUNNER_TEMP/launch-receipts" "$RUNNER_TEMP/source-download/source/worklist.json" \
            --out "$RUNNER_TEMP/launch/launch-registry.json" | jq -er .launch_registry_sha256 > "$RUNNER_TEMP/launch/launch-registry.sha256"
          cat "$RUNNER_TEMP/launch/launch-registry.json"
      - name: Collect the actual workers with the launch registry and recheck the frozen source
        run: |
          set -euo pipefail
          reg="$RUNNER_TEMP/launch/launch-registry.json"
          sha="$(cat "$RUNNER_TEMP/launch/launch-registry.sha256")"
          "$RUNNER_TEMP/analyst/bin/seatlab" study collect-jobs "$RUNNER_TEMP/source-download/source" \
            "$RUNNER_TEMP/worker-returns" --receipt examples/hanabi-panel/source-build.json \
            --launch-registry "$reg" --expect-launch-sha256 "$sha" \
            --out "$RUNNER_TEMP/native-result"
          jq -e '.selection == ["d00"] and .counts == {entries:8,stable:8,changed:0,unknown:0}' "$RUNNER_TEMP/native-result/recheck.json"
          jq -e --arg sha "$sha" '.assignment_basis == "launch-registry" and .launch_registry_sha256 == $sha' \
            "$RUNNER_TEMP/native-result/collection.json"
      - name: Swap two real evidence folders on one native case
        run: |
          set -euo pipefail
          reg="$RUNNER_TEMP/launch/launch-registry.json"
          sha="$(cat "$RUNNER_TEMP/launch/launch-registry.sha256")"
          swap="$RUNNER_TEMP/swapped-returns"
          mkdir "$swap"
          cp -R "$RUNNER_TEMP/worker-returns/d00.lr" "$swap/d00.ll"
          cp -R "$RUNNER_TEMP/worker-returns/d00.ll" "$swap/d00.lr"
          for id in d00.rl d00.rr; do cp -R "$RUNNER_TEMP/worker-returns/$id" "$swap/"; done
          # Bound to the launch registry, the swap is refused and nothing is written.
          code=0
          "$RUNNER_TEMP/analyst/bin/seatlab" study collect-jobs "$RUNNER_TEMP/source-download/source" \
            "$swap" --receipt examples/hanabi-panel/source-build.json \
            --launch-registry "$reg" --expect-launch-sha256 "$sha" \
            --out "$RUNNER_TEMP/swapped-bound" || code=$?
          test "$code" -eq 2
          test ! -e "$RUNNER_TEMP/swapped-bound"
          # Without the registry, the behavior collector cannot see the swap.
          "$RUNNER_TEMP/analyst/bin/seatlab" study collect-jobs "$RUNNER_TEMP/source-download/source" \
            "$swap" --receipt examples/hanabi-panel/source-build.json \
            --out "$RUNNER_TEMP/swapped-unbound"
          jq -e '.counts == {entries:8,stable:8,changed:0,unknown:0}' "$RUNNER_TEMP/swapped-unbound/recheck.json"
      - name: Withhold one valid worker and check the affected criteria only
        run: |
          set -euo pipefail
          subset="$RUNNER_TEMP/partial-returns"
          mkdir "$subset"
          for id in d00.ll d00.lr d00.rl; do cp -R "$RUNNER_TEMP/worker-returns/$id" "$subset/"; done
          code=0
          "$RUNNER_TEMP/analyst/bin/seatlab" study collect-jobs "$RUNNER_TEMP/source-download/source" \
            "$subset" --receipt examples/hanabi-panel/source-build.json \
            --launch-registry "$RUNNER_TEMP/launch/launch-registry.json" --expect-launch-sha256 "$(cat "$RUNNER_TEMP/launch/launch-registry.sha256")" \
            --out "$RUNNER_TEMP/without-rr" || code=$?
          test "$code" -eq 3
          jq -e '.status == "incomplete" and .jobs.missing == ["d00.rr"] and
            .recheck == {entries:8,stable:4,changed:0,unknown:4}' "$RUNNER_TEMP/without-rr/collection.json"
          cp "$RUNNER_TEMP/without-rr/collection.json" "$RUNNER_TEMP/native-result/withheld-worker.json"
      - name: Retain the separate launcher registry even if a worker is missing
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-hanabi-launch-registry
          path: ${{ runner.temp }}/launch/
          if-no-files-found: error
          retention-days: 7
      - name: Retain the sanitized result and complete candidate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-hanabi-candidate-result
          path: ${{ runner.temp }}/native-result/
          if-no-files-found: error
          retention-days: 7
